site_name: Datos Económicos UCR
nav:
  - Introducción: index.md
  - Laboratorios:
    - "Semana 5": labs/semana_5.md
    - "Semana 13": labs/semana_13.md
  - Practicas:
    - "Quiz Stata 1": practicas/stata1.md
  - Videos:
    - "Videos": videos.md
theme:
  name: material
  palette:
    - scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
      primary: teal
    - scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
      primary: teal
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - content.code.annotate
    - content.code.copy
plugins:
  - search
  - macros
markdown_extensions:
  - tables
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tasklist:
      custom_checkbox: true
      clickable_checkbox: false
  - codehilite:
      guess_lang: false
      linenums: true
  - pymdownx.highlight:
      anchor_linenums: true
      use_pygments: true

extra_css:
  - stylesheets/add_stylesheet.css
  - https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/styles/github.min.css
